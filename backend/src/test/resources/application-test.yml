spring:
  datasource:
    url: jdbc:h2:mem:geneinvoice-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        session_factory:
          # Lets a test count the SQL of one request (CountingStatements); it counts nothing until
          # a test asks it to.
          statement_inspector: com.geneinvoice.CountingStatements

app:
  jwt:
    secret: test-secret-that-is-definitely-at-least-32-bytes-long-for-hs256
    expiration-ms: 3600000
  promises:
    # Long enough that the background sweeper never races a test; tests call sweepOverdue directly.
    sweep-interval-ms: 3600000
  regions:
    # Named, not defaulted: a test that asserts on the default region asserts against this line.
    default-code: HQ
  region:
    # The boot check is the point of the region migration, so the tests run under the strict
    # setting production runs under (B1).
    boot-check: strict
  automation:
    # No daemon thread: nothing is handed to the engine in the background while a test is
    # asserting. The nudge arrives on the committing thread, where the dispatcher deliberately
    # does nothing (Spring has not released that transaction yet), so tests drive fan-out and
    # perform by calling the dispatcher directly, exactly as they do for the other two sweepers.
    async: false
    # Long enough that no scheduled run races a test; tests call the dispatcher directly.
    sweep-interval-ms: 3600000
  history:
    # Tests call the reconcile sweep directly, as they do every other job.
    reconcile-interval-ms: 3600000
  documents:
    # A scratch directory of the machine's own, made at startup; never the repository's ./data.
    local:
      root: ${java.io.tmpdir}/geneinvoice-test-documents
  mail:
    # Tests hand email to a recording transport (RecordingMailTransport); the webhook tests switch
    # this to mail-service in a context of their own.
    transport: none
    dispatch:
      # Bulk sends are handed over inline, so a test sees the outcome as soon as the request returns.
      async: false
      # Tests sweep by calling the dispatcher directly.
      sweep-interval-ms: 3600000
    service:
      # Nothing listens here: no test calls a real mail service.
      url: http://127.0.0.1:9
      api-key: test-mail-service-api-key
      webhook-secret: test-mail-service-webhook-secret
