spring:
  application:
    name: gene-invoice
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    # OpenEntityManagerInViewConfig registers it instead, for every endpoint except email's, whose
    # mail service calls must not hold a pooled connection.
    open-in-view: false
    properties:
      hibernate:
        hbm2ddl:
          # A schema `ddl-auto: update` could not apply stops startup instead of being a warning.
          #
          # `update` cannot add a NOT NULL column to a table that already has rows, and it never
          # changes a column that exists. It logs each failure at WARN and carries on, so the app
          # reported itself started and then answered 500 on every request against the table it
          # had failed to migrate — for as long as nobody looked at the log (D-01, regression
          # 2026-09-21). Failing here names the table and column instead, while somebody is
          # watching, and before any user meets it.
          #
          # Set SCHEMA_HALT_ON_ERROR=false to start anyway: for a database whose drift is known
          # and being dealt with, where the rest of the app is still wanted.
          halt_on_error: ${SCHEMA_HALT_ON_ERROR:true}
  task:
    scheduling:
      pool:
        # The email sweeper, the promise sweeper and automation's three jobs — the outbox sweep and
        # the daily and weekly runs — each get a thread, so a slow mail service call (up to 40 s)
        # never holds up the others, and a daily run over a wide rule cannot starve the sweepers.
        size: 5
  servlet:
    multipart:
      # The same setting as app.documents.max-size-bytes below, not a copy of today's value of
      # it: the container's ceiling and the app's own check have to fire on the same upload, or
      # a deployment that raises one is told a limit that is not the one that stopped it (AC-C9).
      max-file-size: ${DOCUMENT_MAX_BYTES:10485760}
      max-request-size: ${DOCUMENT_MAX_REQUEST_BYTES:12582912}   # the file, plus room for the rest of the form
      file-size-threshold: 1MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-this-must-be-at-least-32-bytes-long-secret-key}
    expiration-ms: 86400000
  invoice:
    default-payment-term: ${INVOICE_DEFAULT_TERM:NET_30}  # a customer with no terms, and the backfill
    due-date-horizon-days: ${INVOICE_DUE_DATE_HORIZON_DAYS:365}  # the form warns past this; the API accepts it
  automation:
    # in-process runs the consumer on a background thread of this service, and it is the only
    # transport this build has. The automation_events row written inside the user's own transaction
    # is what makes the work durable, and the sweep below is what re-drives it — the queue only
    # decides how quickly a consumer hears about it (R3) — so nothing is lost by it being the only
    # one. A broker-backed transport is a follow-up, and AutomationQueue is the seam it would be
    # written against; when one exists, its value is named here and not before.
    #
    # This line used to offer `rabbit` as well. Nothing implements it, and the in-process bean is
    # conditional on this very value, so setting it left no AutomationQueue bean and the service
    # died at startup on "no qualifying bean of type AutomationQueue" — a message about Spring
    # wiring, for an operator who had done nothing but believe the comment above it (D-75,
    # regression 2026-09-21). AutomationQueueCheck now refuses an unknown value by name, at startup:
    # rules raise the tasks people are counting on, so a deployment that asks for a transport nobody
    # can supply must stop while somebody is watching rather than start with its rules never firing.
    queue: ${AUTOMATION_QUEUE:in-process}     # in-process — the only transport this build has
    async: true                               # false runs the work on the calling thread
    sweep-interval-ms: 60000                  # re-drives anything the queue lost, and settles the stale
    retain-days: 30                           # settled rows are purged past this; failed ones are kept
    daily-cron: "0 0 7 * * *"                 # UTC, like every date the app judges by
    weekly-cron: "0 0 7 * * MON"
  documents:
    storage: ${DOCUMENT_STORAGE:local}                # local | none
    max-size-bytes: ${DOCUMENT_MAX_BYTES:10485760}    # 10 MB; the multipart limits above read the same variable
    allowed-types: application/pdf,image/png,image/jpeg,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    local:
      root: ${DOCUMENT_ROOT:./data/documents}         # made at startup when it is not there
  mail:
    transport: ${MAIL_TRANSPORT:none}                 # none | mail-service
    dispatch:
      async: true
      sweep-interval-ms: 60000
    service:
      url: ${MAIL_SERVICE_URL:http://localhost:8091}
      api-key: ${MAIL_SERVICE_API_KEY:}               # required with transport mail-service
      webhook-secret: ${MAIL_SERVICE_WEBHOOK_SECRET:} # required with transport mail-service
      connect-timeout-ms: 5000
      read-timeout-ms: 40000                          # connecting calls Google
      webhook-max-bytes: 33554432                     # largest webhook body read; 32 MiB

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/geneinvoice}
    username: ${DB_USER:geneinvoice}
    password: ${DB_PASSWORD:geneinvoice}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:geneinvoice;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: azurefree
  datasource:
    url: jdbc:h2:file:${H2_DATA_DIR:/home/site/data}/geneinvoice;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
