spring:
  application:
    name: gene-invoice
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    # OpenEntityManagerInViewConfig registers it instead, for every endpoint except email's, whose
    # mail service calls must not hold a pooled connection.
    open-in-view: false
    properties:
      hibernate:
        hbm2ddl:
          # A schema `ddl-auto: update` could not apply stops startup instead of being a warning.
          #
          # `update` cannot add a NOT NULL column to a table that already has rows, and it never
          # changes a column that exists. It logs each failure at WARN and carries on, so the app
          # reported itself started and then answered 500 on every request against the table it
          # had failed to migrate — for as long as nobody looked at the log (D-01, regression
          # 2026-09-21). Failing here names the table and column instead, while somebody is
          # watching, and before any user meets it.
          #
          # Set SCHEMA_HALT_ON_ERROR=false to start anyway: for a database whose drift is known
          # and being dealt with, where the rest of the app is still wanted.
          halt_on_error: ${SCHEMA_HALT_ON_ERROR:true}
  task:
    scheduling:
      pool:
        # The email sweeper, the promise sweeper, the history reconciler, the approval housekeeping, the automation
        # consumer and the automation schedule tick each get a thread, so a slow mail service call (up to 40 s) never
        # holds up the others; one spare.
        size: 7
  servlet:
    multipart:
      # The same setting as app.documents.max-size-bytes below, not a copy of today's value of
      # it: the container's ceiling and the app's own check have to fire on the same upload, or
      # a deployment that raises one is told a limit that is not the one that stopped it (AC-C9).
      max-file-size: ${DOCUMENT_MAX_BYTES:10485760}
      max-request-size: ${DOCUMENT_MAX_REQUEST_BYTES:12582912}   # the file, plus room for the rest of the form
      file-size-threshold: 1MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-this-must-be-at-least-32-bytes-long-secret-key}
    expiration-ms: 86400000
  invoice:
    default-payment-term: ${INVOICE_DEFAULT_TERM:NET_30}  # a customer with no terms, and the backfill
    due-date-horizon-days: ${INVOICE_DUE_DATE_HORIZON_DAYS:365}  # the form warns past this; the API accepts it
  documents:
    storage: ${DOCUMENT_STORAGE:local}                # local | none
    max-size-bytes: ${DOCUMENT_MAX_BYTES:10485760}    # 10 MB; the multipart limits above read the same variable
    allowed-types: application/pdf,image/png,image/jpeg,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    local:
      root: ${DOCUMENT_ROOT:./data/documents}         # made at startup when it is not there
  mail:
    transport: ${MAIL_TRANSPORT:none}                 # none | mail-service
    dispatch:
      async: true
      sweep-interval-ms: 60000
    service:
      url: ${MAIL_SERVICE_URL:http://localhost:8091}
      api-key: ${MAIL_SERVICE_API_KEY:}               # required with transport mail-service
      webhook-secret: ${MAIL_SERVICE_WEBHOOK_SECRET:} # required with transport mail-service
      connect-timeout-ms: 5000
      read-timeout-ms: 40000                          # connecting calls Google
      webhook-max-bytes: 33554432                     # largest webhook body read; 32 MiB
  history:
    # A record whose version cannot be built (a mapping error, not a database one) is logged and skipped, and
    # its old version stays until the reconciler catches up: history must never stop a save. Tests say true.
    strict: false
    # How often the reconciler repairs history that drifted from the live tables (and how long after startup it
    # first runs): once a day.
    reconcile-interval-ms: 86400000
  approval:
    # For this long after a customer moves region, a change to it is held at the stricter of the old and the new
    # region's limits, so a move can never be a way round a limit.
    move-cooldown-days: 30
  automation:
    # The outbox consumer (A5): off stops the poll; events keep being written and wait until it is on again.
    consumer-enabled: true
    poll-interval-ms: 2000
    tick-interval-ms: 30000
    batch-size: 50                       # events claimed per page of a drain
    lease-seconds: 300                   # a worker that stopped gives its event back after this long
    max-attempts: 5                      # a failing event is given up on (DEAD) after this many attempts
    max-claims: 20                       # ... or after this many claims that never finished
    page-size: 500                       # records per page of a set run
    slice-budget-ms: 10000
    default-max-records-per-run: 1000
    max-actions-per-rule-per-hour: 1000
    max-email-recipients: 50
    max-catch-up-slots: 31               # a rule catching up slot by slot (ALL) runs at most this many
    event-retention-days: 14             # also bounds history_transactions and replay
    default-zone: ${AUTOMATION_ZONE:UTC}
    node-id: ${AUTOMATION_NODE_ID:}      # empty: the host's name and a random suffix

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/geneinvoice}
    username: ${DB_USER:geneinvoice}
    password: ${DB_PASSWORD:geneinvoice}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # The requests, plus the background jobs: the automation consumer runs each action in a transaction of its own.
      maximum-pool-size: 8
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:geneinvoice;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: azurefree
  datasource:
    url: jdbc:h2:file:${H2_DATA_DIR:/home/site/data}/geneinvoice;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
