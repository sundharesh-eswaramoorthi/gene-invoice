services:
  postgres:
    image: postgres:16
    container_name: gene-invoice-db
    environment:
      POSTGRES_DB: geneinvoice
      POSTGRES_USER: geneinvoice
      POSTGRES_PASSWORD: geneinvoice
    ports:
      - "5433:5432"
    volumes:
      - gene_invoice_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geneinvoice"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gene_invoice_pgdata:
